<!doctype html>
<html lang="en" data-skin="blob">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
<title>Notch Pet</title>
<link rel="stylesheet" href="pet.css">
<link rel="stylesheet" href="notch.css">
</head>
<body class="sleep">
  <div id="shell">
    <span class="ear l" aria-hidden="true"></span><span class="ear r" aria-hidden="true"></span>
    <div id="notch" role="region" aria-label="Notch Pet">
      <header class="bar">
        <div id="petslot" data-t-title="tickle_me"></div>
        <div class="label" aria-live="polite"><span id="title">Zzz…</span><span id="sub"></span></div>
        <div class="counters" id="counters"></div>
        <div class="actions">
          <button class="icon-btn" id="gear" data-t-title="settings" data-t-aria="settings"></button>
          <button class="icon-btn" id="quit" data-t-title="quit_app" data-t-aria="quit_app"></button>
        </div>
      </header>
      <div class="statusline" aria-hidden="true"></div>
      <div class="peekcard" id="peekcard"></div>
      <div class="panel">
        <ul class="list" id="list"></ul>
        <footer class="stats" id="stats"></footer>
      </div>
    </div>
  </div>
<script src="shared.js"></script>
<script src="notch.js"></script>
</body>
</html>
